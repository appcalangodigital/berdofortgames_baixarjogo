<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berdo Fort Games</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://appcalangodigital.github.io/berdofortgames_baixarjogo/">
  <meta property="og:title" content="Berdo Fort Games - Jogos que respeitam as crianças">
  <meta property="og:description" content="O Cangaceiro do Cuscuz: um jogo com a identidade do Nordeste, criado para não gerar ansiedade nem vício. Baixe agora no celular!">
  <meta property="og:image" content="https://appcalangodigital.github.io/berdofortgames_baixarjogo/preview.png">
  <meta property="og:image:type" content="image/png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://appcalangodigital.github.io/berdofortgames_baixarjogo/preview.png">
  <meta name="theme-color" content="#1a0f05">
  <link rel="icon" href="https://appcalangodigital.github.io/berdofortgames_oxente/icon-512.png">

  <!-- Contador de visitas (GoatCounter) -->
  <script data-goatcounter="https://berdofortgamesbaixarjogo.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff7e6;
      background: linear-gradient(180deg, #2a1608 0%, #7a3b0c 55%, #d9822b 100%);
    }
    .card { width: 100%; max-width: 380px; }
    .logo {
      width: 160px; height: 160px; border-radius: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: 2px; }
    .sub { margin: 0 0 28px; font-size: 1.15rem; color: #ffd9a0; }
    .btn {
      display: block; width: 100%; padding: 16px 20px;
      background: #f5b700; color: #2a1608; font-weight: 800; font-size: 1.15rem;
      text-decoration: none; border-radius: 14px;
      box-shadow: 0 6px 0 #a87a00, 0 10px 20px rgba(0,0,0,.35);
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #a87a00; }
    .dica { margin-top: 18px; font-size: .95rem; color: #ffe8c4; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://appcalangodigital.github.io/berdofortgames_oxente/icon-512.png" alt="Berdo Fort Games">
    <h1>BERDO FORT GAMES</h1>
    <p class="sub">O Cangaceiro do Cuscuz 🌽</p>

    <a id="baixar" class="btn" href="https://appcalangodigital.github.io/berdofortgames_oxente/">📲 BAIXAR O JOGO</a>

    <p class="dica">Abra no celular e toque em "Instalar no celular".</p>
  </main>

  <script>
    // Conta cada clique no botão "Baixar o jogo" e depois abre o jogo
    document.getElementById('baixar').addEventListener('click', function (e) {
      var link = this.href;
      try {
        if (window.goatcounter && window.goatcounter.count) {
          e.preventDefault();
          window.goatcounter.count({
            path: 'clique-baixar-jogo',
            title: 'Clique em Baixar o Jogo',
            event: true
          });
          setTimeout(function () { window.location.href = link; }, 300);
        }
      } catch (err) { /* se der erro, o link abre normalmente */ }
    });
  </script>
</body>
</html>
