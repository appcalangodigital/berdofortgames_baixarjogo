  <script>
    // Conta cada clique em "Baixar" separado por jogo e depois abre o jogo
    document.querySelectorAll('.baixar').forEach(function (b) {
      b.addEventListener('click', function (e) {
        var link = this.href, path = this.dataset.path, titulo = this.dataset.titulo;
        try {
          if (window.goatcounter && window.goatcounter.count) {
            e.preventDefault();
            window.goatcounter.count({ path: path, title: titulo, event: true });
            setTimeout(function () { window.location.href = link; }, 300);
          }
        } catch (err) { /* se der erro, o link abre normalmente */ }
      });
    });
  </script>
